openapi: 3.0.3
info:
  title: IoT Smart Home Controller API
  description: >
    API cho hệ thống quản lý thiết bị điện thông minh (đèn, quạt, điều hòa)
    giao tiếp qua MQTT với NodeMCU ESP8266/ESP32.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Local dev server

tags:
  - name: Auth
  - name: Users
  - name: Devices
  - name: Sensors
  - name: Actions

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, password]
              properties:
                full_name: { type: string, example: "Đỗ Minh Quân" }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409':
          description: Email đã tồn tại

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: Sai email hoặc mật khẩu

  /users/me:
    get:
      tags: [Users]
      summary: Lấy thông tin cá nhân
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Thông tin user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
    put:
      tags: [Users]
      summary: Cập nhật thông tin cá nhân / đổi mật khẩu
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full_name: { type: string }
                old_password: { type: string }
                new_password: { type: string }
      responses:
        '200': { description: Cập nhật thành công }

  /devices:
    get:
      tags: [Devices]
      summary: Danh sách thiết bị và trạng thái hiện tại
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Danh sách thiết bị
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [Devices]
      summary: Thêm thiết bị mới
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201': { description: Tạo thành công }

  /devices/{id}/action:
    post:
      tags: [Devices]
      summary: Gửi lệnh bật/tắt thiết bị (UC03)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [ON, OFF] }
      responses:
        '202':
          description: Lệnh đã được gửi qua MQTT, đang chờ phản hồi từ phần cứng
          content:
            application/json:
              schema:
                type: object
                properties:
                  action_id: { type: integer }
                  status: { type: string, example: pending }
        '404': { description: Không tìm thấy thiết bị }

  /sensors:
    get:
      tags: [Sensors]
      summary: Lịch sử dữ liệu cảm biến (UC04)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sensor_id
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Danh sách bản ghi cảm biến
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DataSensor' }

  /sensors/latest:
    get:
      tags: [Sensors]
      summary: Giá trị cảm biến mới nhất cho Dashboard
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Giá trị mới nhất từng cảm biến
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DataSensor' }

  /actions:
    get:
      tags: [Actions]
      summary: Lịch sử hành động điều khiển thiết bị (UC05)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: device_id
          in: query
          schema: { type: integer }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Danh sách lịch sử hành động
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActionHistory' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: integer }
        full_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, user] }
    Device:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        device_type: { type: string, enum: [light, fan, air_conditioner] }
        location: { type: string }
        current_state: { type: string, enum: [ON, OFF] }
    DeviceInput:
      type: object
      required: [name, device_type]
      properties:
        name: { type: string }
        device_type: { type: string, enum: [light, fan, air_conditioner] }
        location: { type: string }
    DataSensor:
      type: object
      properties:
        id: { type: integer }
        sensor_id: { type: integer }
        sensor_type: { type: string }
        value: { type: number }
        unit: { type: string }
        recorded_at: { type: string, format: date-time }
    ActionHistory:
      type: object
      properties:
        id: { type: integer }
        device_id: { type: integer }
        device_name: { type: string }
        user_id: { type: integer }
        action: { type: string, enum: [ON, OFF] }
        status: { type: string, enum: [pending, success, failed, timeout] }
        triggered_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time }
